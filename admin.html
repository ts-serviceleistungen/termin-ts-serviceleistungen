<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T.S. Serviceleistungen – Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="brand" href="index.html"><span>TS</span><b>T.S. SERVICELEISTUNGEN · ADMIN</b></a>
  <button id="logout">Abmelden</button>
</header>

<main>
  <section id="login" class="panel login">
    <small>ADMIN LOGIN</small>
    <h1>Verwaltung</h1>
    <form id="loginForm">
      <label>E-Mail<input id="email" type="email" required></label>
      <label>Passwort<input id="password" type="password" required></label>
      <button class="primary">Anmelden</button>
      <p id="loginMsg" class="notice hidden"></p>
    </form>
  </section>

  <section id="dash" class="hidden">
    <div class="title">
      <div><small>VERWALTUNG</small><h1>Terminanfragen</h1></div>
      <button id="refresh" class="primary">Aktualisieren</button>
    </div>

    <div class="stats">
      <div><b id="newc">0</b><small>Neue</small></div>
      <div><b id="open">0</b><small>Offen</small></div>
      <div><b id="today">0</b><small>Heute</small></div>
    </div>

    <section class="panel">
      <div class="head"><b>Anfragen</b><span id="user"></span></div>
      <div id="list"></div>
    </section>
  </section>
</main>

<div id="detailModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div><small>ANFRAGE</small><h2 id="detailTitle">Details</h2></div>
      <button id="closeModal" class="close">×</button>
    </div>
    <div id="detailBody"></div>
    <div id="detailActions" class="modal-actions"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js?v=clean1"></script>
</body>
</html>
